<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ post.title }} | Digital Journal</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Georgia, "Times New Roman", serif;
            background: #f7f5f0;
            color: #1c2633;
        }

        nav {
            background: #142235;
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: #d6b36a;
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        nav a {
            color: #f7f5f0;
            text-decoration: none;
            margin-left: 28px;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }

        nav a:hover {
            color: #d6b36a;
        }

        .article {
            width: 82%;
            max-width: 850px;
            margin: 70px auto;
            background: white;
            padding: 55px;
            border: 1px solid #e4dfd5;
            border-radius: 6px;
            box-shadow: 0 8px 25px rgba(20, 34, 53, 0.06);
        }

        .article h1 {
            color: #142235;
            font-size: 42px;
            font-weight: normal;
            line-height: 1.3;
            margin-bottom: 15px;
        }

        .post-info {
            font-family: Arial, sans-serif;
            color: #9a7a3c;
            font-size: 13px;
            margin-bottom: 35px;
        }

        .gold-line {
            width: 65px;
            height: 2px;
            background: #d6b36a;
            margin-bottom: 35px;
        }

        .content {
            font-family: Arial, sans-serif;
            color: #4b5563;
            font-size: 17px;
            line-height: 1.9;
        }

        .back {
            display: inline-block;
            margin-top: 40px;
            color: #142235;
            font-family: Arial, sans-serif;
            font-size: 13px;
            font-weight: bold;
            text-decoration: none;
            border-bottom: 1px solid #d6b36a;
            padding-bottom: 4px;
        }

        .back:hover {
            color: #9a7a3c;
        }

        footer {
            background: #142235;
            color: #cbd2da;
            text-align: center;
            padding: 30px 20px;
            font-family: Arial, sans-serif;
            font-size: 13px;
            margin-top: 80px;
        }

        footer span {
            color: #d6b36a;
        }

        @media (max-width: 650px) {
            .article {
                width: 90%;
                padding: 30px;
            }

            .article h1 {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <div class="logo">DIGITAL JOURNAL</div>

        <div>
            <a href="/">Home</a>
            <a href="/admin/">Admin</a>
        </div>
    </nav>

    <article class="article">

        <h1>{{ post.title }}</h1>

        <div class="post-info">
            By {{ post.author }}
            &nbsp; • &nbsp;
            {{ post.created_at|date:"F d, Y" }}
        </div>

        <div class="gold-line"></div>

        <div class="content">
            {{ post.content|linebreaks }}
        </div>

        <a href="/" class="back">
            ← BACK TO HOME
        </a>

    </article>

    <footer>
        © 2026 <span>Digital Journal</span>
        · A Django Blog Project
    </footer>

</body>
</html>
